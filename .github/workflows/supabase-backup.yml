- name: Dump critical tables
  env:
    PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    PGHOST: aws-0-ap-northeast-2.pooler.supabase.com
    PGPORT: 5432
    PGUSER: postgres.mzmskujwpqmokbrdbwbh
    PGDATABASE: postgres
    PGSSLMODE: require
  run: |
    mkdir -p backup

    pg_dump \
      --data-only \
      -t public.devices \
      -t public.device_channels \
      -t public.device_members \
      -t public.device_events \
      -f backup/a5x-home-backup-$(date +%F).sql
