name: Supabase Keepalive
on:
  schedule:
    - cron: '0 6 */3 * *'   # har 3 din, 06:00 UTC
  workflow_dispatch: {}      # manual run ka button bhi mil jaayega

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          curl -sf -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/devices?select=device_id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
